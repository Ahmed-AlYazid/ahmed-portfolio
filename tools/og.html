<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Social card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Geist:wght@400..600&family=Geist+Mono:wght@500&display=block" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; padding: 72px 80px; background: #0b0c0e; color: #eeeff1;
      font-family: Geist, "Segoe UI", sans-serif; display: flex; flex-direction: column;
    }
    body::before {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 70% 80% at 85% 20%, #000 10%, transparent 70%);
    }
    .top { position: relative; display: flex; justify-content: space-between; font: 500 18px/1 "Geist Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #a0a5ae; }
    .top span:last-child { color: #3ddc97; }
    h1 { position: relative; margin: auto 0 0; font: 800 116px/.88 "Bricolage Grotesque", sans-serif; letter-spacing: -.055em; }
    h1 span { color: #ff6a3d; }
    .role { position: relative; margin-top: 30px; font: 500 24px/1.3 "Geist Mono", monospace; }
    .role i { font-style: normal; color: #ff6a3d; padding: 0 10px; }
    .stats { position: relative; display: flex; gap: 14px; margin-top: 44px; }
    .stats div { padding: 16px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: #141519; }
    .stats strong { display: block; font: 700 34px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; }
    .stats small { display: block; margin-top: 8px; font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #a0a5ae; }
  </style>
</head>
<body>
  <div class="top"><span>AI graduate · Makkah, Saudi Arabia</span><span>● Live platform in production</span></div>
  <h1>Ahmed Saeed<br>AlYazid<span>.</span></h1>
  <p class="role">Machine Learning<i>/</i>Data Science<i>/</i>Computer Vision</p>
  <div class="stats">
    <div><strong>96.3%</strong><small>Best reported accuracy</small></div>
    <div><strong>0.996</strong><small>AUC-ROC</small></div>
    <div><strong>3</strong><small>Runnable models</small></div>
  </div>
</body>
</html>
