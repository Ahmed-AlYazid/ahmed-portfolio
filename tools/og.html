<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Social card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..600&family=Unbounded:wght@800..900&family=IBM+Plex+Mono:wght@500&display=block" />
  <style>
    /* Same identity as the portfolio hero: Graphite & Cobalt, diamond pattern, the name as the mark. */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; display: flex; flex-direction: column; padding: 64px 80px 0;
      background: #0e0f12; color: #eef1f6; font-family: "Readex Pro", "Segoe UI", sans-serif;
      background-image: repeating-conic-gradient(from 45deg, rgba(91, 140, 255, .06) 0 25%, transparent 0 50%); background-size: 44px 44px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; font: 500 19px/1 "IBM Plex Mono", monospace; color: #a3a9b6; }
    .top span { display: inline-flex; align-items: center; gap: 12px; }
    .dia { width: 10px; height: 10px; background: #5b8cff; transform: rotate(45deg); }
    .live .dia { background: #5eead4; }
    h1 { margin: auto 0 0; font: 900 104px/.9 "Unbounded", sans-serif; letter-spacing: -.055em; text-transform: uppercase; }
    h1 span { display: block; }
    h1 .last { color: #5b8cff; }
    .stats { display: flex; gap: 14px; margin: 34px 0 40px; }
    .stats div { padding: 14px 20px; border-radius: 14px; border: 1.5px solid rgba(238, 241, 246, .16); background: #15171c; }
    .stats strong { display: block; font: 600 30px/1 "Readex Pro", sans-serif; }
    .stats small { display: block; margin-top: 8px; font: 500 13px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: #a3a9b6; }
    .band { display: flex; gap: 34px; align-items: center; margin: 0 -80px; padding: 0 80px; height: 58px; background: #5b8cff; color: #050b1f; font: 800 24px/1 "Unbounded", sans-serif; letter-spacing: -.02em; text-transform: uppercase; white-space: nowrap; }
    .band i { width: 11px; height: 11px; flex: none; background: #050b1f; opacity: .45; transform: rotate(45deg); }
  </style>
</head>
<body>
  <div class="top"><span><i class="dia"></i>AI graduate · Makkah, Saudi Arabia</span><span class="live"><i class="dia"></i>Live platform in production</span></div>
  <h1><span>Ahmed Saeed</span><span class="last">AlYazid</span></h1>
  <div class="stats">
    <div><strong>96.3%</strong><small>Best reported accuracy</small></div>
    <div><strong>0.996</strong><small>AUC-ROC</small></div>
    <div><strong>3</strong><small>Models that run in the browser</small></div>
  </div>
  <div class="band"><span>Machine learning</span><i></i><span>Computer vision</span><i></i><span>Data science</span><i></i><span>Production AI</span></div>
</body>
</html>
