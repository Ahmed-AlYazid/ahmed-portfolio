<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Page not found — Ahmed AlYazid</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Geist:wght@400..600&family=Geist+Mono:wght@500&display=swap" />
  <style>
    :root{--bg:#0b0c0e;--text:#eeeff1;--muted:#a0a5ae;--line:rgba(255,255,255,.08);--accent:#ff6a3d;--ink:#160803}
    @media (prefers-color-scheme: light){:root{--bg:#f4f3ef;--text:#111215;--muted:#555a62;--line:rgba(14,15,17,.09);--accent:#c2410c;--ink:#fff}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.6 Geist,"Segoe UI",system-ui,sans-serif}
    body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle,#000,transparent 70%);mask-image:radial-gradient(circle,#000,transparent 70%)}
    main{position:relative;max-width:560px;text-align:center}
    small{font:500 .75rem/1 "Geist Mono",monospace;letter-spacing:.06em;color:var(--accent)}
    h1{margin:14px 0 0;font:800 clamp(96px,22vw,180px)/.85 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.06em}
    h1 span{color:var(--accent)}
    p{color:var(--muted);margin:18px 0 0}
    a{display:inline-flex;align-items:center;min-height:48px;margin-top:24px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body><main><small>PAGE NOT FOUND</small><h1>404<span>.</span></h1><p>The requested page does not exist.</p><a href="/">Return to the portfolio →</a></main></body>
</html>
